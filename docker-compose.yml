# docker-compose.yml — Local development stack
# TODO: adjust image versions, volumes, and ports to your preferences

version: '3.9'

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: le-onze-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: le-onze-comptable
    # TODO: add MONGO_INITDB_ROOT_USERNAME and MONGO_INITDB_ROOT_PASSWORD for production

  # ── Node.js / Express Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile          # TODO: create backend/Dockerfile
    container_name: le-onze-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/le-onze-comptable
      JWT_SECRET: change_me_in_production
      CLIENT_ORIGIN: http://localhost:4200
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules

  # ── Angular Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile          # TODO: create frontend/Dockerfile
    container_name: le-onze-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data:
