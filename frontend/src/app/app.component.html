<header class="app-header">
  <a class="brand" routerLink="/">{{ title }}</a>
  <nav aria-label="Navigation principale">
    <ul>
      @for (link of navLinks; track link.path) {
        <li>
          <a [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ link.label }}</a>
        </li>
      }
    </ul>
  </nav>
</header>

<main class="app-main">
  <router-outlet />
</main>

<footer class="app-footer">
  <p class="api-health" aria-live="polite">
    @if (healthLoading()) {
      <span>Vérification de la connexion au serveur en cours.</span>
    } @else if (healthError()) {
      <span class="api-health-error">{{ healthError() }}</span>
    } @else {
      <span class="api-health-ok">{{ healthSummary() }}</span>
    }
  </p>
</footer>
